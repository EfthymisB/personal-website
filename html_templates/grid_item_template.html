<div class="flip-container">
  <div class="flipper">
    <div class="front">
      <div class="front-container">
        <img src="FRONT_IMG_PATH" loading="lazy" alt="Movie poster" />
        <img
          src="media/website-utils/click.png"
          id="click"
          loading="lazy"
          alt="Click to flip"
        />
      </div>
    </div>
    <div class="ribbon-container">
      <h4 class="ribbon">Credited</h4>
    </div>
    <div class="back">
      <div class="back-text">
        <div class="project-title"><span>TITLE</span></div>
        <div class="project-year"><span>YEAR</span></div>
        <div class="project-stars"><span>STARRING</span></div>
        <div class="project-description">
          <span>DESCRIPTION</span>
        </div>

        <div class="imdb">
          <!-- add hyperlink when clicked-->
          <a href="IMDB_LINK" target="_blank" class="imdb-link">
            <img
              src="https://ia.media-imdb.com/images/G/01/imdb/plugins/rating/images/imdb_38x18.png"
            />
          </a>
          <span class="rating">RATING</span>
          <span class="votes">VOTES votes</span>
        </div>
        <div class="role-company-location">
          <p>ROLE<br />COMPANY<br />LOCATION<br /></p>
        </div>
      </div>
    </div>
  </div>
</div>
